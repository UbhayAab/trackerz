<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trackerz · Gym</title>
    <script>(function(){try{var p=localStorage.getItem('trackerz.theme')||'system';var d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}})();</script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#138a5b" />
  </head>
  <body>
    <div class="app-shell page-shell">
      <header class="topbar topbar-tight">
        <div>
          <p class="eyebrow">Trackerz</p>
          <h1 class="topbar-title">Gym</h1>
        </div>
        <a class="icon-link" href="./settings.html" aria-label="Settings">⚙</a>
      </header>

      <main>
        <!-- The two moves the owner actually makes: one tap for went/skipped,
             and one line of text or voice for what was trained. -->
        <section class="command-panel" id="gymToday" aria-label="Log today's training">
          <p class="muted small">Loading today…</p>
        </section>

        <!-- The nine-exercise checklist. Opt-in, not the front door: in a month
             of real use it produced zero logged sets, because logging a session
             through it is nine taps and a weight nudged up from 0 kg. -->
        <details class="command-panel gym-detail" id="workoutLogWrap">
          <summary>
            <span class="gym-detail-title">Log exercise by exercise</span>
            <span class="muted small">prescribed sets, reps and weights</span>
          </summary>
          <div id="workoutLog" aria-label="Workout log">
            <p class="muted small">Loading the prescribed session…</p>
          </div>
        </details>

        <section class="command-panel" id="bodyComposition" aria-label="Body composition">
          <div class="panel-title-row"><div><p class="eyebrow">Body</p><h2>Composition</h2></div></div>
          <p class="muted small">Loading…</p>
        </section>
        <section class="command-panel" id="gymInsights" aria-label="Gym intelligence">
          <div class="panel-title-row"><div><p class="eyebrow">Training</p><h2>Gym intelligence</h2></div></div>
          <p class="muted small">Consistency, progression and bodyweight insight appears here once data loads.</p>
        </section>
      </main>

      <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation"><a class="nav-item" href="../index.html">Home</a><a class="nav-item" href="../pages/money.html">Money</a><a class="nav-item active" href="../pages/gym.html" aria-current="page">Gym</a><a class="nav-item" href="../pages/analytics.html">Stats</a><a class="nav-item" href="../pages/settings.html">Settings</a></nav>
    </div>

    <script type="module" src="../src/pages/gym.js"></script>
  </body>
</html>
