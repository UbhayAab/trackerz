name: Build Android APK

# Builds a release-signed Trackerz APK entirely on the GitHub runner, so the
# phone owner never installs Android Studio, the JDK, or the Android SDK.
# They just open the fixed download link on their phone.
#
# WHY THIS IS NOT A DEBUG BUILD ANY MORE
# --------------------------------------
# It used to run `assembleDebug` with no keystore. GitHub runners are
# ephemeral, so the Android Gradle Plugin generated a fresh random
# ~/.android/debug.keystore on every run. Measured on two builds six minutes
# apart, the signer certificates were:
#   run 30153825634 -> d8f0df6e68f854bc4ba98b834948569d486dc43ce8032fdb8e34dcea9384df40
#   run 30154001974 -> 0078982d0160ca433f179c0385f85117e7796c8ca7ee1a25c8ef8c234220e7bc
# Android keys an installed app on (applicationId, signing certificate), so the
# second APK could never install over the first - "App not installed" with no
# explanation. versionCode was also pinned at 1 forever, which independently
# lets the installer refuse an upgrade.
#
# Now: one fixed keystore from ANDROID_KEYSTORE_B64, versionCode from the run
# number, and a verification step that prints the signer fingerprint so a
# regression is visible in the log instead of on the phone.
#
# NOTE: Health Connect reads remain UNVERIFIED ON HARDWARE. CI proves the
# project assembles and is signed correctly; it cannot prove the OnePlus watch
# bridge returns data.

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Read the repo, and write releases so every push refreshes the downloadable APK.
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  # NOT cancel-in-progress. The publish step is the last thing this workflow
  # does, and cancelling a run midway through publishing is how you get a
  # half-published release - a deleted tag with no asset behind it, which serves
  # a 404 that Chrome happily saves as "trackerz.apk". A superseded build simply
  # queues and is overtaken; that costs a few CI minutes and nothing else.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install the Capacitor tooling WITHOUT touching the repo's package.json
      # or its test-time devDependencies. --no-save keeps package.json/lockfile
      # unchanged so `npm test` (a plain node:assert chain) is never affected.
      - name: Install Capacitor tooling (no-save)
        run: |
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

      # webDir cannot be "." - the Capacitor CLI hard-rejects ".", "./", "..".
      # So we mirror the EXISTING web app (unchanged, not forked) into www/,
      # which capacitor.config.json points at. Everything the browser loads
      # (index.html, pages/, src/, lib/, vendor/, styles/, icons/, sw.js,
      # manifest, share-target) is copied verbatim. Native/build/dev-only
      # trees are excluded so they do not bloat the WebView assets.
      #
      # docs/ and *.md are excluded because they were being shipped INSIDE the
      # APK: 1.8 MB of audit screenshots plus every markdown file, baked into
      # assets/public where nothing can ever read them. That was a quarter of
      # the download the owner was waiting on.
      - name: Stage web app into www/
        run: |
          rm -rf www
          mkdir -p www
          rsync -a \
            --exclude='www' \
            --exclude='android' \
            --exclude='ios' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='scripts' \
            --exclude='supabase' \
            --exclude='screenshots' \
            --exclude='docs' \
            --exclude='*.md' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='capacitor.config.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ www/
          test -f www/index.html || { echo "www/index.html missing after staging"; exit 1; }

      # android/ is committed (it holds the Kotlin Health Connect plugin), so
      # normally we only sync. The `cap add` branch is a safety net for a fresh
      # checkout where android/ was somehow not committed.
      - name: Add android platform if missing
        run: |
          if [ ! -f android/settings.gradle ]; then
            echo "android/ not committed - generating platform"
            npx cap add android
          else
            echo "android/ present - will sync only"
          fi

      # Copies www/ into the native project and regenerates the Capacitor
      # config/plugin glue (assets/public, capacitor.build.gradle, etc.).
      - name: Capacitor sync
        run: npx cap sync android

      # THE MANIFEST MUST STILL BE OURS AFTER SYNC.
      #
      # Three source files carry a comment claiming "the GitHub Actions workflow
      # copies this file back into place after sync". No such step has ever
      # existed. It has been harmless only because `cap sync` leaves the manifest
      # alone - but the `cap add` branch above DOES regenerate it, and if that
      # ever fires CI would happily build, sign and publish an APK with no SMS,
      # no Health Connect, no microphone and no registered plugins. It would
      # install cleanly and quietly do nothing.
      #
      # So assert the load-bearing lines instead of trusting a comment. Cheap,
      # and it fails the build rather than shipping a hollow app.
      - name: Verify the native manifest survived sync
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          for needle in \
            'android.permission.READ_SMS' \
            'android.permission.RECORD_AUDIO' \
            'android.permission.MODIFY_AUDIO_SETTINGS' \
            'android.permission.POST_NOTIFICATIONS' \
            'android.permission.health.READ_SLEEP' \
            'android.speech.RecognitionService' \
            'HealthPrivacyPolicyActivity' \
            'PaymentNotificationListenerService' ; do
            grep -q "$needle" "$M" || { echo "::error::AndroidManifest lost '$needle' - cap sync/add regenerated it"; exit 1; }
          done
          # cap add would also replace the Kotlin entry point with a Java stub,
          # dropping every registerPlugin() call.
          test ! -f android/app/src/main/java/com/ubhayaab/trackerz/MainActivity.java \
            || { echo "::error::MainActivity.java appeared - the Kotlin entry point with its plugin registrations was replaced"; exit 1; }
          # Every app-local plugin must still be registered. `cap add` would
          # replace MainActivity.kt with a stock Java stub and silently drop all
          # of these - the app would install fine and simply have no microphone,
          # no SMS capture, no Health Connect and no water widget.
          for plugin in HealthConnectPlugin SmsReaderPlugin NotifyReaderPlugin WaterWidgetPlugin SpeechPlugin ; do
            grep -q "registerPlugin($plugin" android/app/src/main/java/com/ubhayaab/trackerz/MainActivity.kt \
              || { echo "::error::$plugin is no longer registered in MainActivity.kt"; exit 1; }
          done
          echo "manifest intact, 5 plugins registered"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Materialise the ONE stable signing key. Without it every build gets a
      # different certificate and the APK cannot install over its predecessor.
      - name: Install signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not set - falling back to a throwaway debug key."
            echo "::warning::This APK will NOT install over an existing Trackerz. It will not be published."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/trackerz.jks
          cat > android/keystore.properties <<EOF
          storeFile=trackerz.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "Stable keystore installed ($(wc -c < android/trackerz.jks) bytes)"

      # Release build, signed with the stable key. versionCode comes from the
      # run number so each build is a genuine upgrade, never a sidegrade.
      - name: Build APK
        working-directory: android
        env:
          TRACKERZ_VERSION_CODE: ${{ github.run_number }}
          TRACKERZ_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "${{ steps.signing.outputs.stable }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          DIR=release
          [ "${{ steps.signing.outputs.stable }}" = "true" ] || DIR=debug
          APK=$(find "android/app/build/outputs/apk/$DIR" -name '*.apk' | head -n1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      # Prove the signature. The whole bug was an unverified assumption about
      # which key signed the artifact, so assert it in the log every time.
      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs --verbose "${{ steps.apk.outputs.path }}" | tee /tmp/sig.txt
          # build-tools 37 prints "V3.0 Signer: certificate SHA-256 digest: <hex>";
          # older ones print "Signer #1 certificate SHA-256 digest: <hex>". Match
          # on the part both share so a toolchain bump cannot fake a mismatch.
          FP=$(grep -i 'certificate SHA-256 digest' /tmp/sig.txt | head -n1 | awk '{print $NF}')
          test -n "$FP" || { echo "::error::Could not read a signer fingerprint from apksigner output."; exit 1; }
          echo "### APK signer SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.stable }}" = "true" ]; then
            EXPECTED=d4e36fdc74b185d1012dc1b18ad3e5d30fb15d458db288127a9f6c5d04186a1a
            if [ "$FP" != "$EXPECTED" ]; then
              echo "::error::Signer changed. Expected $EXPECTED, got $FP. This APK would not install over the previous one."
              exit 1
            fi
            echo "Signer matches the pinned Trackerz sideload key."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackerz-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Refresh the fixed-URL "android-latest" release so the owner always has a
      # one-tap download link that points at the newest build - no digging
      # through workflow runs, no unzipping an artifact, no GitHub login on the
      # phone. Only runs on main, and only for a stably-signed APK: publishing a
      # randomly-keyed build to the permanent link is what caused the original
      # "cannot install" problem, so it is now refused outright.
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="1.0.${{ github.run_number }}"
          cp "${{ steps.apk.outputs.path }}" trackerz.apk
          cp "${{ steps.apk.outputs.path }}" "trackerz-${VER}.apk"

          # NEVER DELETE THE RELEASE.
          #
          # This used to `gh release delete android-latest --cleanup-tag` and
          # recreate it on every push to main. That mints a NEW asset id and a
          # new ETag each time, so any download that was paused - or that a
          # phone tried to resume - came back to an object that no longer
          # existed. Android's DownloadManager cannot resume across an If-Range
          # mismatch, so it parks the row in pause/resume forever. Worse, the
          # delete and the create are consecutive commands: a run cancelled
          # between them leaves the URL 404ing, and Chrome saves GitHub's 404
          # HTML page as trackerz.apk - a few KB that can never install.
          #
          # So: create the release once if it is missing, then upload. The
          # VERSIONED asset is immutable and never re-uploaded, which is what
          # gives it a stable ETag and makes a paused download resumable. The
          # floating trackerz.apk is clobbered for muscle memory and old links.
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest \
              --title "Deno Android app" \
              --notes "Rolling release. Each build adds an immutable trackerz-<version>.apk; trackerz.apk always points at the newest." \
              --latest
          fi
          gh release upload android-latest "trackerz-${VER}.apk" --clobber
          gh release upload android-latest trackerz.apk --clobber

          # A machine-readable pointer for the in-app update check, served from
          # the release itself so it can never disagree with the binary.
          SIZE=$(stat -c%s trackerz.apk)
          SHA=$(sha256sum trackerz.apk | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "${VER}",
            "sizeBytes": ${SIZE},
            "sha256": "${SHA}",
            "url": "https://github.com/${{ github.repository }}/releases/download/android-latest/trackerz-${VER}.apk",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          JSON
          gh release upload android-latest latest.json --clobber

          gh release edit android-latest \
            --title "Deno Android app (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} (versionCode ${{ github.run_number }}) from ${{ github.sha }} on $(date -u +%Y-%m-%d).

          Release-signed with the fixed Trackerz sideload key (SHA-256 d4e36fdc...186a1a), so it installs straight over any other build carrying that key.

          FIRST TIME ONLY: if a Trackerz built before 2026-07-31 is still on the phone, uninstall it before installing this one. Every build before then was signed with a different throwaway key and Android refuses to replace an app whose signature does not match. After this one, updates just work.

          After installing: Settings -> grant Health Connect, notification access and SMS. See docs/ANDROID-APK.md." \
            --latest
